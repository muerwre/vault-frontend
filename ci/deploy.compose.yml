# Reference deployment. The database is assumed to already exist and is not
# managed here — `ci/compose.yml` is the local, seeded one for development.
#
# Only the backend is published: it answers /api itself and proxies every page
# to the frontend container. The host's reverse proxy sends everything to it;
# see nginx.example.conf.
name: vault

services:
  backend:
    image: git.vault48.org/muerwre/vault-frontend-backend:master
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000

      DATABASE_URL: mariadb://user:password@db:3306/adonis

      # Must match the secret that signed the tokens already in circulation:
      # they carry no expiry, so changing this logs everybody out.
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}

      # Uploaded files are addressed relative to this; changing it breaks every
      # historical URL.
      UPLOADS_PATH: /var/lib/vault/uploads
      UPLOADS_MAX_SIZE_MB: 200

      # Where people open the site. Links in mail/Telegram/VK posts and the
      # OAuth callbacks (<PUBLIC_URL>/api/oauth/<provider>/process/) derive from
      # it. Must match the frontend image's PUBLIC_URL build arg.
      PUBLIC_URL: https://vault48.org
      # The frontend container, which renders every page.
      FRONTEND_URL: http://frontend:3000

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # OAuth login via VK ID. Both or neither — a partly configured provider
      # answers 404.
      VK_CLIENT_ID: ${VK_CLIENT_ID}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET}

      # Wall publishing: on when the group and its token are both set. It posts to
      # a live group — leave NOTIFICATIONS_VK_GROUP_ID empty until cutover.
      NOTIFICATIONS_VK_API_KEY: ${NOTIFICATIONS_VK_API_KEY}
      NOTIFICATIONS_VK_GROUP_ID: ${NOTIFICATIONS_VK_GROUP_ID}
      NOTIFICATIONS_VK_ALBUM_ID: ${NOTIFICATIONS_VK_ALBUM_ID}
      NOTIFICATIONS_VK_APP_ID: ${NOTIFICATIONS_VK_APP_ID}

      # A live token sends real messages and verifies the login widget.
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      # Runs the bot and notification delivery when set (with the token). One
      # poller per token: leave it empty until the outgoing backend's bot stops.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      # Set when api.telegram.org is unreachable from the host.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL}
    volumes:
      # The uploads directory outlives the container; losing it loses every
      # image ever posted.
      - vault_uploads:/var/lib/vault/uploads
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: git.vault48.org/muerwre/vault-frontend:master
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # Not published: reached only by the backend, as FRONTEND_URL.

volumes:
  vault_uploads:
    external: true
