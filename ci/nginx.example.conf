# Reference reverse-proxy config. Two upstreams: Next.js serves the app, NestJS
# serves the API and uploaded files.
#
# Copy and adapt — TLS, logging and rate limits are left to the host config.

upstream vault_frontend {
    server 127.0.0.1:3000;
}

upstream vault_backend {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name vault48.org;

    # Must be at least UPLOADS_MAX_SIZE_MB, or large uploads fail at the proxy
    # with a 413 before the backend ever sees them.
    client_max_body_size 200m;

    # The API. Everything under here is the backend's, including the OAuth
    # handshake — whose session cookie is scoped to /api/oauth, so this prefix
    # must be passed through unrewritten.
    location /api/ {
        proxy_pass http://vault_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads and image scaling can both outlast the default timeout.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded files and their scaled variants. Public-facing URLs are /static/…
    # while the backend serves them under /api/static/, so the prefix is
    # rewritten here. Clients build these URLs from stored `file.url` values, so
    # the public shape cannot change.
    location /static/ {
        proxy_pass http://vault_backend/api/static/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The backend already sets long-lived cache headers on generated
        # variants; this keeps a copy at the edge as well.
        proxy_cache_valid 200 7d;
    }

    # The app itself.
    location / {
        proxy_pass http://vault_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev/HMR and any future websocket use.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
