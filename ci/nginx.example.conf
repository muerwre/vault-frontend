# Reference reverse-proxy config. The live one lives on the host, not in this
# repo; this documents the shape it needs.
#
# Everything goes to the backend, the only published service. It answers /api
# and /static itself and proxies every other request to the frontend container,
# so there is nothing to route here.

upstream vault_backend {
    server 127.0.0.1:8000;
}

server {
    listen 443 ssl http2;
    server_name vault48.org;

    # Must be at least UPLOADS_MAX_SIZE_MB, or large uploads fail here with a
    # 413 before the backend sees them.
    client_max_body_size 200m;

    location / {
        proxy_pass http://vault_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
